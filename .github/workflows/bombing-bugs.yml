name: Bombing Bugs
on:
  push:
    paths: ['bombing-bugs/**', '.github/workflows/bombing-bugs.yml', 'downhill-rush/tests/lifecycle.py']
  pull_request:
    paths: ['bombing-bugs/**', '.github/workflows/bombing-bugs.yml', 'downhill-rush/tests/lifecycle.py']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release with this tag (for example bombing-bugs-v0.1.0); empty for a plain build
        required: false
        default: ''
permissions:
  contents: read
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
    with:
      path: bombing-bugs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.2 and the Windows export templates
        uses: ontola/gamenight/.github/actions/setup-godot@main
        with:
          version: 4.6.2
          export-templates: windows_release_x86_64.exe windows_release_x86_64_console.exe
      - name: Import, simulate and check host lifecycle
        run: |
          "$GODOT" --headless --path bombing-bugs --editor --import --quit
          "$GODOT" --headless --path bombing-bugs --script tests/simulation.gd
          "$GODOT" --headless --path bombing-bugs --script tests/results-ui.gd
          python3 bombing-bugs/tests/lifecycle.py "$GODOT"
      - name: Export Windows build
        run: |
          mkdir -p dist
          "$GODOT" --headless --path bombing-bugs --export-release Windows "$PWD/dist/BombingBugs.exe"
          cp bombing-bugs/gamenight.json dist/
          cp LICENSE dist/
          printf '{"revision":"%s","engine":"4.6.2","game":"bombing-bugs"}\n' "$GITHUB_SHA" > dist/BUILD.json
          (cd dist && zip -q BombingBugs-windows.zip BombingBugs.exe gamenight.json LICENSE BUILD.json && sha256sum BombingBugs-windows.zip > release-sha256.txt && cat release-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bombing-bugs-windows
          path: |
            dist/BombingBugs-windows.zip
            dist/release-sha256.txt
          if-no-files-found: error
  release:
    needs: [gamenight-sdk, build]
    # A manual run that names the tag to create; this repo holds several games.
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release, 'bombing-bugs-v')
    runs-on: ubuntu-latest
    environment: gamenight-bombing-bugs
    permissions:
      contents: write
    env:
      # A GameNight publish key for bombing-bugs; without it the GameNight steps are skipped.
      GAMENIGHT_API_TOKEN: ${{ secrets.GAMENIGHT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bombing-bugs-windows
          path: release
      - name: Publish the tested build and the store media
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          cd release
          sha256sum --check release-sha256.txt
          media=../bombing-bugs/assets/gamenight
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" BombingBugs-windows.zip release-sha256.txt $media/preview.mp4 $media/preview.jpg $media/cover.png $media/icon.png $media/gameplay.png --repo "$GITHUB_REPOSITORY" --title "Bombing Bugs ${RELEASE_TAG#bombing-bugs-}" --notes-file ../bombing-bugs/docs/release-notes.md
      - uses: actions/checkout@v4
        if: env.GAMENIGHT_API_TOKEN != ''
        with:
          repository: ontola/gamenight
          ref: 5703cf0c0adee10db4ac9adfb06d0edaf28b2010
          path: .gamenight
          sparse-checkout: scripts/gamenight-publish.py
          sparse-checkout-cone-mode: false
      # Store page first: a stable release needs the five-second clip.
      - name: Update the GameNight store page and publish the build to players
        if: env.GAMENIGHT_API_TOKEN != ''
        env:
          RELEASE_TAG: ${{ inputs.release }}
        working-directory: bombing-bugs
        run: |
          python3 ../.gamenight/scripts/gamenight-publish.py store
          python3 ../.gamenight/scripts/gamenight-publish.py push --game bombing-bugs --file ../release/BombingBugs-windows.zip --platform windows --entrypoint BombingBugs.exe --version "${RELEASE_TAG#bombing-bugs-}" --channel stable --changelog-file docs/release-notes.md
