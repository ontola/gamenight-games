name: Game simulations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
    with:
      path: downhill-rush
  downhill-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          echo "30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937  godot.zip" | sha256sum -c -
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.6.2-stable_linux.x86_64
          echo "$GITHUB_WORKSPACE/godot-bin" >> "$GITHUB_PATH"
      - name: Check Downhill Rush physics, courses and host lifecycle
        run: |
          GODOT=Godot_v4.6.2-stable_linux.x86_64
          "$GODOT" --headless --path downhill-rush --editor --import
          for check in air_speed rider_animation braking wheel_contact terrain_variety course_check scenery_check ride_check; do
            "$GODOT" --headless --path downhill-rush --script "tests/$check.gd"
          done
          python3 downhill-rush/tests/lifecycle.py --godot "$GODOT"
      - name: Install Windows export template
        run: |
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          dir="$HOME/.local/share/godot/export_templates/4.6.2.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$dir"
      - name: Export Windows package
        run: |
          mkdir -p dist
          Godot_v4.6.2-stable_linux.x86_64 --headless --path downhill-rush --export-release Windows "$PWD/dist/DownhillRush.exe"
          (cd dist && zip -q downhill-rush-windows.zip DownhillRush.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: downhill-rush-windows
          path: dist/downhill-rush-windows.zip
          if-no-files-found: error
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: game-source
      - uses: actions/checkout@v4
        with:
          repository: ontola/gamenight
          ref: b46414a5a513942edb16dd434b78779b68e142b0
          path: host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y love
      - name: Test and package source under review
        working-directory: host
        env:
          GAMENIGHT_GAMES_DIR: ../game-source
          ALSOFT_DRIVERS: 'null'
        run: |
          python scripts/test-love-simulation.py --love love
          python scripts/package-love-party.py --output dist/party
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-party-candidate
          path: host/dist/party/*.love
          if-no-files-found: error
  publish:
    needs: games
    if: github.event_name != 'pull_request' && vars.GAMENIGHT_PUBLISH_ENABLED == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: gamenight-${{ matrix.game }}
    strategy:
      fail-fast: false
      matrix:
        game: [blast-party, neon-trails, neon-siege, ricochet-club, volley-trouble, stack-together, bubble-buddies]
        platform: [windows, mac]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gamenight-party-candidate
          path: package
      - uses: ontola/gamenight@488258365a7fe55df3fd7677ca85b513980db492
        with:
          token: ${{ secrets.GAMENIGHT_API_TOKEN }}
          game: ${{ matrix.game }}
          file: package/${{ matrix.game }}.love
          platform: ${{ matrix.platform }}
          entrypoint: ${{ matrix.game }}.love
          version: ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          channel: preview
  publish-downhill:
    needs: [downhill-physics, gamenight-sdk]
    if: github.event_name != 'pull_request' && vars.GAMENIGHT_PUBLISH_ENABLED == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: gamenight-downhill-rush
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: downhill-rush-windows
          path: package
      - uses: ontola/gamenight@488258365a7fe55df3fd7677ca85b513980db492
        with:
          token: ${{ secrets.GAMENIGHT_API_TOKEN }}
          game: downhill-rush
          file: package/downhill-rush-windows.zip
          platform: windows
          entrypoint: DownhillRush.exe
          version: ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          channel: preview
