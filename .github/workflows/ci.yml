name: Game simulations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
    with:
      path: downhill-rush
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: game-source
      - uses: actions/checkout@v4
        with:
          repository: ontola/gamenight
          ref: b46414a5a513942edb16dd434b78779b68e142b0
          path: host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y love
      - name: Test and package source under review
        working-directory: host
        env:
          GAMENIGHT_GAMES_DIR: ../game-source
          ALSOFT_DRIVERS: 'null'
        run: |
          python scripts/test-love-simulation.py --love love
          python scripts/package-love-party.py --output dist/party
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-party-candidate
          path: host/dist/party/*.love
          if-no-files-found: error
  publish:
    needs: games
    if: github.event_name != 'pull_request' && vars.GAMENIGHT_PUBLISH_ENABLED == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: gamenight-${{ matrix.game }}
    strategy:
      fail-fast: false
      matrix:
        game: [blast-party, neon-trails, neon-siege, ricochet-club, volley-trouble, stack-together, bubble-buddies]
        platform: [windows, mac]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gamenight-party-candidate
          path: package
      - uses: ontola/gamenight@b46414a5a513942edb16dd434b78779b68e142b0
        with:
          token: ${{ secrets.GAMENIGHT_API_TOKEN }}
          game: ${{ matrix.game }}
          file: package/${{ matrix.game }}.love
          platform: ${{ matrix.platform }}
          entrypoint: ${{ matrix.game }}.love
          version: ci-${{ github.sha }}
          channel: preview
